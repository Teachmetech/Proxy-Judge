# Deliberately unencrypted Proxy Judge endpoint for HTTP-only forward proxies.
#
# This file is mounted separately from default.conf because setup-tls.sh
# regenerates default.conf. Keep the DNS record for this hostname DNS-only in
# Cloudflare so nginx sees the proxy exit node as the TCP peer and Cloudflare
# cannot apply an HTTP-to-HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name plain.proxy-judge.com;

    location = /judge {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # Preserve X-Forwarded-For exactly as the proxy under test sent it.
        # Appending the TCP peer would change the evidence used for anonymity
        # classification.
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Express/Helmet emits HSTS by default. Browsers ignore HSTS received
        # over HTTP, but omit it here so this endpoint's contract is explicit.
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-store" always;

        proxy_pass http://proxy_judge_api;
    }

    # Keep this hostname purpose-specific. The normal API exposes health,
    # headers, and documentation routes over HTTPS.
    location / {
        return 404;
    }
}
